name: lms_platform
description: "منصة تعليمية - Learning Management System"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  pinput: ^5.0.2
  animated_bottom_navigation_bar: ^1.4.0
  flutter_rating_bar: ^4.0.0
  smooth_page_indicator: ^1.2.1
  carousel_slider: ^5.1.1
  flutter_slidable: ^3.1.2
  auto_size_text: ^3.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  toastification: ^2.3.0
  # Supabase & State Management
  supabase_flutter: ^2.8.0
  flutter_bloc: ^8.1.6
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  onesignal_flutter: ^5.2.4
  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.5
  get_it: ^8.0.2
  # Localization
  easy_localization: ^3.0.7
  # Logging
  logger: ^2.4.0
  # Skeleton Loading
  shimmer: ^3.0.0
  # Package Info
  package_info_plus: ^9.0.0
  # URL Launcher
  url_launcher: ^6.3.2
  # Image Picker
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.5
  # File Picker (for attachments)
  file_picker: ^8.0.0+1
  # Image Compression
  flutter_image_compress: ^2.3.0
  # Shared Preferences
  shared_preferences: ^2.5.0
  # Date formatting
  intl: any
  # Image caching
  flutter_cache_manager: any
  path_provider: any
  # Cached Network Image for optimized image loading
  cached_network_image: ^3.4.1
  # Deep Links
  chottu_link: 1.0.19
  app_links: ^6.3.3
  # Share
  share_plus: ^10.1.4
  connectivity_plus: ^7.0.0
  # Charts
  fl_chart: ^0.69.2
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3
  # Payment
  webview_windows: ^0.4.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.16.1
  http: ^1.6.0
  youtube_player_flutter: ^9.1.3
  # Video player web support
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8
  # Screen recording prevention
  # Country Picker
  country_picker: ^2.0.26
  # Open Files
  open_filex: ^4.4.0
  font_awesome_flutter: ^11.0.0
  uuid: ^4.5.1
  mime: ^2.0.0
  image: ^4.8.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - assets/fonts/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai/Almarai-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo2.png"  # استخدام PNG بدلاً من JPG
  min_sdk_android: 21
  # Adaptive icon لأندرويد (بدون إطار أبيض)
  adaptive_icon_background: "#06142F"
  adaptive_icon_foreground: "assets/logo2.png"
  web:
    generate: true
    image_path: "assets/logo2.png"
    background_color: "#06142F"
  windows:
    generate: true
    image_path: "assets/logo2.png"
    icon_size: 256
